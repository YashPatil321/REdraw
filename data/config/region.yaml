name: 4s_ranch_del_sur
display_name: 4S Ranch and Del Sur, San Diego
# Starting bbox. Verify against OSM place boundaries for "4S Ranch" and
# "Del Sur, San Diego" and expand so I 15 (east), SR 56 (south),
# Black Mountain Open Space (west), and the San Dieguito River (north) are included.
bbox:
  south: 32.993
  north: 33.040
  west: -117.165
  east: -117.080
# Focused core (2026-10-01): 4S Ranch + Del Sur plus the adjacent I 15 stretch, ~7.9 x 5.2 km.
# Smaller than the spec's starting box on purpose so the world renders at much higher
# detail. SR 56 and the rest of I 15 are reached through the exits below.
bbox_verified: true
projection: EPSG:32611        # UTM 11N, meters, for all processing
scene_origin: center_of_bbox  # client uses local meters relative to this point
terrain_buffer_m: 500
tiles: [8, 8]                 # rows x cols for terrain/building/road tiling (8x8 since the HD build)
timezone: America/Los_Angeles

# Key arterials to label in the client. Names must match OSM `name` tags
# (case-insensitive prefix match). verified: false until checked against OSM.
arterial_labels:
  - {name: Camino del Norte, verified: true}
  - {name: Camino del Sur, verified: true}
  - {name: Dove Canyon Road, verified: true}
  - {name: 4S Ranch Parkway, verified: true}
  - {name: Bernardo Center Drive, verified: true}
  - {name: Carmel Valley Road, verified: true}
  - {name: Black Mountain Road, verified: true}
  - {name: Carmel Mountain Road, verified: true}
  - {name: Rancho Bernardo Road, verified: true}
  - {name: Paseo del Sur, verified: true}
  - {name: Del Dios Highway, verified: true}
  - {name: Escondido Freeway, ref: I 15, verified: true}
  - {name: Ted Williams Freeway, ref: CA 56, verified: true}
  - {name: Ted Williams Parkway, ref: CA 56, verified: true}

# Where trips with destinations outside the bbox leave the network.
# Pipeline snaps each to the nearest drive-graph node of a matching road near the bbox edge.
# Bearing is the compass direction (deg) of jobs that use this exit.
exits:
  # Where real roads (Overture/OSM 2026-09-23.1) cross the bbox edge. bearing_deg is the
  # compass direction of the jobs that use the exit. verified: false until checked on a map.
  - {id: i15_north, label: I 15 north, lat: 33.0093, lon: -117.0806, bearing_deg: 20, verified: false}
  - {id: i15_south, label: I 15 south, lat: 32.9931, lon: -117.0834, bearing_deg: 185, verified: false}
  - {id: cds_south, label: Camino del Sur south (to SR 56 west), lat: 32.9937, lon: -117.1583, bearing_deg: 225, verified: false}
  - {id: cvr_south, label: Carmel Valley Road south, lat: 32.9942, lon: -117.1191, bearing_deg: 170, verified: false}
  - {id: cdn_east, label: Camino del Norte east, lat: 32.9975, lon: -117.0826, bearing_deg: 120, verified: false}
  - {id: bcd_east, label: Bernardo Center Drive east, lat: 33.0121, lon: -117.0807, bearing_deg: 75, verified: false}
  - {id: deldios_north, label: Del Dios Highway north, lat: 33.0372, lon: -117.1644, bearing_deg: 330, verified: false}
  - {id: sandieguito_west, label: San Dieguito Road west, lat: 33.0043, lon: -117.1637, bearing_deg: 275, verified: false}

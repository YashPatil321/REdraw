name: 4s_ranch_del_sur
display_name: 4S Ranch and Del Sur, San Diego
# Starting bbox. Verify against OSM place boundaries for "4S Ranch" and
# "Del Sur, San Diego" and expand so I 15 (east), SR 56 (south),
# Black Mountain Open Space (west), and the San Dieguito River (north) are included.
bbox:
  south: 32.948
  north: 33.050
  west: -117.180
  east: -117.065
# Expanded from the spec starting box after checking real data (Overture/OSM roads,
# 3DEP DEM): the old box cut off SR 56 and the north-east stretch of I 15.
bbox_verified: true
projection: EPSG:32611        # UTM 11N, meters, for all processing
scene_origin: center_of_bbox  # client uses local meters relative to this point
terrain_buffer_m: 500
tiles: [4, 4]                 # rows x cols for terrain/building tiling
timezone: America/Los_Angeles

# Key arterials to label in the client. Names must match OSM `name` tags
# (case-insensitive prefix match). verified: false until checked against OSM.
arterial_labels:
  - {name: Camino del Norte, verified: true}
  - {name: Camino del Sur, verified: true}
  - {name: Dove Canyon Road, verified: true}
  - {name: 4S Ranch Parkway, verified: true}
  - {name: Bernardo Center Drive, verified: true}
  - {name: Carmel Valley Road, verified: true}
  - {name: Black Mountain Road, verified: true}
  - {name: Carmel Mountain Road, verified: true}
  - {name: Rancho Bernardo Road, verified: true}
  - {name: Paseo del Sur, verified: true}
  - {name: Del Dios Highway, verified: true}
  - {name: Escondido Freeway, ref: I 15, verified: true}
  - {name: Ted Williams Freeway, ref: CA 56, verified: true}
  - {name: Ted Williams Parkway, ref: CA 56, verified: true}

# Where trips with destinations outside the bbox leave the network.
# Pipeline snaps each to the nearest drive-graph node of a matching road near the bbox edge.
# Bearing is the compass direction (deg) of jobs that use this exit.
exits:
  # Positions read from the real drive graph (Overture/OSM, release 2026-09-23.1)
  # where each road meets the bbox edge. verified: false until checked on a map.
  - {id: i15_north, label: I 15 north, lat: 33.0495, lon: -117.0726, bearing_deg: 10,  verified: false}
  - {id: i15_south, label: I 15 south, lat: 32.9490, lon: -117.1025, bearing_deg: 190, verified: false}
  - {id: sr56_west, label: SR 56 west, lat: 32.9550, lon: -117.1795, bearing_deg: 265, verified: false}
  - {id: cdn_east,  label: Camino del Norte east, lat: 32.9879, lon: -117.0672, bearing_deg: 100, verified: false}

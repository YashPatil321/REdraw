# Tool definitions (spec 7.1). Tools are data: the client builds its forms from
# these definitions (via GET /tools), and sim/plan.py implements each tool id.
#
# Param types (the client renders an input per type; the API validates):
#   school        -> string, a school id from GET /world/schools
#   entrance      -> string, "<school_id>/<entrance_id>"
#   time          -> string "HH:MM"
#   int, float    -> number with min/max/step
#   select        -> string, one of `options` (each {value, label})
#   bool          -> boolean
#   text          -> string (max_length)
#   point         -> [lat, lon]                      (map click, snaps to nearest road edge)
#   points        -> [[lat, lon], ...]               (map clicks, max_count)
#   polyline      -> [[lat, lon], ...] (>= 2 points)  (map clicks, snaps to roads)
#   edge          -> int, drive network edge_idx      (map click on a road)
#   node          -> int, drive network node_id       (map click on an intersection)
#
# `map_input: true` marks params the client collects by clicking on the map.
# Costs reference keys in assumptions.yaml -> costs / tool_effects.

tools:
  - id: bell_time
    name: Change bell time
    category: schedule
    description: Move a school's start time. Shifts when students and drop-off drivers leave home.
    cost_note: No direct cost. Moving bell times can affect bus contracts (not modeled in v1).
    params:
      - {id: school, label: School, type: school, required: true}
      - {id: start, label: New start time, type: time, required: true, default: "09:00", min: "07:00", max: "09:30"}

  - id: school_shuttle
    name: School shuttle
    category: transit
    description: Run shuttle buses from neighborhood stops to a school. Kids within walking distance of a stop can ride instead of being driven.
    cost_note: Per bus per year (assumptions.costs.school_shuttle_per_bus_year).
    params:
      - {id: school, label: School, type: school, required: true}
      - {id: stops, label: Stops, type: points, required: true, map_input: true, max_count: 12}
      - {id: buses, label: Buses, type: int, required: true, default: 2, min: 1, max: 12, step: 1}
      - {id: headway_min, label: Minutes between buses, type: int, required: true, default: 15, min: 5, max: 60, step: 5}

  - id: carpool_program
    name: Carpool program
    category: demand
    description: Matching app plus incentives for families and commuters to share rides.
    cost_note: Per year by incentive level (assumptions.costs.carpool_program_per_year).
    params:
      - {id: school, label: School (or all), type: school, required: false, allow_all: true}
      - id: incentive
        label: Incentive level
        type: select
        required: true
        default: medium
        options:
          - {value: low, label: Low (app and outreach)}
          - {value: medium, label: Medium (small rewards)}
          - {value: high, label: High (cash incentives)}

  - id: dropoff_redesign
    name: Drop-off redesign
    category: school_site
    description: Add curb spots or speed up unloading at an existing drop-off entrance.
    cost_note: Upfront per added curb spot; per year for a faster unload program.
    params:
      - {id: entrance, label: Entrance, type: entrance, required: true}
      - {id: extra_curb_spots, label: Extra curb spots, type: int, required: true, default: 4, min: 0, max: 20, step: 1}
      - {id: faster_unload, label: Faster unload program, type: bool, required: false, default: false}

  - id: new_dropoff_entrance
    name: New drop-off entrance
    category: school_site
    description: Open a new drop-off point connected to a nearby road. Splits drop-off traffic between entrances.
    cost_note: Upfront construction (assumptions.costs.new_dropoff_entrance_upfront).
    params:
      - {id: school, label: School, type: school, required: true}
      - {id: location, label: Location, type: point, required: true, map_input: true}
      - {id: curb_spots, label: Curb spots, type: int, required: true, default: 6, min: 2, max: 20, step: 1}

  - id: signal_timing
    name: Signal retiming
    category: roads
    description: Retime a traffic signal to favor one direction during the morning peak.
    cost_note: Small upfront per intersection.
    params:
      - {id: node, label: Intersection, type: node, required: true, map_input: true}
      - id: priority
        label: Priority direction
        type: select
        required: true
        default: north_south
        options:
          - {value: north_south, label: North-south}
          - {value: east_west, label: East-west}

  - id: turn_lane
    name: Turn lane
    category: roads
    description: Add a turn pocket on an approach. Raises that approach's capacity. Does not add through lanes.
    cost_note: Upfront per approach.
    params:
      - {id: edge, label: Road approach, type: edge, required: true, map_input: true}

  - id: bike_route
    name: Bike route
    category: active
    description: Build or upgrade a bike route. Makes biking more attractive for short trips near the route.
    cost_note: Per km.
    params:
      - {id: path, label: Route, type: polyline, required: true, map_input: true}
      - id: facility
        label: Facility
        type: select
        required: true
        default: buffered
        options:
          - {value: buffered, label: Buffered bike lane}
          - {value: protected, label: Protected bikeway}

  - id: safe_walk_route
    name: Safe walk route
    category: active
    description: Fill sidewalk gaps and mark crossings along a route to school. Optional crossing guards.
    cost_note: Per km, plus crossing guards per year.
    params:
      - {id: path, label: Route, type: polyline, required: true, map_input: true}
      - {id: school, label: School served, type: school, required: false}
      - {id: crossing_guards, label: Crossing guards, type: bool, required: false, default: true}

  - id: teen_drive_policy
    name: Teen driving policy
    category: demand
    description: Cap student parking permits at a high school. Limits how many students drive themselves.
    cost_note: No direct cost.
    params:
      - {id: school, label: School, type: school, required: true}
      - {id: permits_cap, label: Parking permits cap, type: int, required: true, default: 150, min: 0, max: 1500, step: 10}

  - id: custom
    name: Custom idea
    category: custom
    description: Describe your own idea. An AI converts it into model levers you confirm before running. Always labeled "LLM estimated".
    cost_note: Estimated by the LLM and flagged.
    enabled_in_mvp: true
    params:
      - {id: description, label: Describe your idea, type: text, required: true, max_length: 600}

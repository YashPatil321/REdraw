modechoice:
  # Multinomial logit. Utility U_m = ASC_m + b_time*time_min + b_cost*cost_usd + b_habit*habit_m + tool shifts.
  beta_time_per_min: {value: -0.06, unit: 1/min, range: [-0.10, -0.03], source: "typical commute MNL VOT ~ $12/h with b_cost -0.3", verified: false}
  beta_cost_per_usd: {value: -0.30, unit: 1/USD, range: [-0.6, -0.15], source: literature range for commute MNL, verified: false}
  beta_habit: {value: 1.2, unit: utils, range: [0.5, 2.0], source: "inertia toward current (baseline) mode; guess", verified: false}
  vehicle_cost_per_km: {value: 0.22, unit: USD/km, range: [0.15, 0.35], source: AAA marginal operating cost approx, verified: false}
  speeds_kph:
    walk_child: {value: 4.0, unit: kph, range: [3.0, 5.0], source: typical child walking speed, verified: false}
    walk_adult: {value: 4.8, unit: kph, range: [4.0, 5.5], source: typical adult walking speed, verified: false}
    bike: {value: 14.0, unit: kph, range: [10.0, 18.0], source: casual cycling with hills, verified: false}
    bus_avg: {value: 25.0, unit: kph, range: [18.0, 32.0], source: school bus/shuttle average incl. stops, verified: false}
  # Alternative specific constants for STUDENT school trips (relative to drive_dropoff = 0).
  asc_student:
    drive_dropoff: {value: 0.0, unit: utils, range: null, source: reference alternative, verified: true}
    carpool: {value: -1.2, unit: utils, range: [-2.0, -0.5], source: "calibrated so baseline carpool share ~10 percent; guess", verified: false}
    school_bus: {value: -1.8, unit: utils, range: [-3.0, -1.0], source: "PUSD offers very limited busing; guess", verified: false}
    school_shuttle: {value: -0.8, unit: utils, range: [-1.5, -0.3], source: "new service; similar to bus but closer stops; guess", verified: false}
    walk: {value: -0.4, unit: utils, range: [-1.0, 0.0], source: guess, verified: false}
    bike: {value: -0.9, unit: utils, range: [-1.5, -0.3], source: guess, verified: false}
    self_drive: {value: 0.3, unit: utils, range: [-0.5, 1.0], source: "teens prefer driving; gated by hs_self_drive_share", verified: false}
  # ASC for WORKER trips (relative to drive_alone = 0).
  asc_worker:
    drive_alone: {value: 0.0, unit: utils, range: null, source: reference alternative, verified: true}
    carpool: {value: -2.2, unit: utils, range: [-3.0, -1.5], source: "ACS carpool share ~7 percent", verified: false}
    bike: {value: -3.5, unit: utils, range: [-4.5, -2.5], source: "ACS bike share < 1 percent", verified: false}
    walk: {value: -3.0, unit: utils, range: [-4.0, -2.0], source: "ACS walk share ~1 percent", verified: false}
  max_walk_km_by_age:
    "5-10": {value: 1.2, unit: km, range: [0.8, 1.6], source: "NHTS child walk distances; guess", verified: false}
    "11-13": {value: 2.0, unit: km, range: [1.5, 2.5], source: guess, verified: false}
    "14-18": {value: 2.5, unit: km, range: [2.0, 3.2], source: guess, verified: false}
    adult: {value: 2.5, unit: km, range: [1.5, 3.5], source: guess, verified: false}
  max_bike_km_by_age:
    "5-10": {value: 0.0, unit: km, range: [0.0, 1.5], source: "young kids do not bike alone to school; guess", verified: false}
    "11-13": {value: 4.0, unit: km, range: [2.5, 5.0], source: guess, verified: false}
    "14-18": {value: 6.0, unit: km, range: [4.0, 8.0], source: guess, verified: false}
    adult: {value: 10.0, unit: km, range: [6.0, 15.0], source: guess, verified: false}
  school_bus_available_share: {value: 0.05, unit: share, range: [0.0, 0.15], source: "share of students eligible for PUSD home-to-school busing; guess", verified: false}
  carpool_kids_per_car: {value: 2.5, unit: kids, range: [2.0, 3.5], source: guess, verified: false}
  carpool_worker_occupancy: {value: 2.1, unit: persons, range: [2.0, 2.5], source: NHTS carpool occupancy, verified: false}
  shuttle_max_walk_to_stop_km: {value: 0.6, unit: km, range: [0.4, 0.8], source: "standard transit catchment (quarter to half mile)", verified: false}
  shuttle_capacity: {value: 50, unit: riders, range: [40, 72], source: typical school bus, verified: false}


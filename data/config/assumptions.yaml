  default_height_m:
    house: {value: 7.0, unit: m, range: [5.0, 9.0], source: spec 5.2 (typical 2-story SFH), verified: false}
    commercial: {value: 8.0, unit: m, range: [5.0, 14.0], source: spec 5.2, verified: false}
    school: {value: 9.0, unit: m, range: [6.0, 12.0], source: spec 5.2, verified: false}
    apartments: {value: 11.0, unit: m, range: [8.0, 16.0], source: typical 3-story garden apartments, verified: false}
    other: {value: 5.0, unit: m, range: [3.0, 8.0], source: guess for sheds/garages/other, verified: false}
  hip_roof_rectangularity: {value: 0.85, unit: ratio, range: [0.75, 0.95], source: "footprint area / min rotated rect area; above this a house gets a hip roof", verified: true}
  hip_roof_height_m: {value: 2.2, unit: m, range: [1.5, 3.0], source: typical 5:12 roof pitch on a 10 m wide house, verified: false}

roads:
  lane_width_m: {value: 3.6, unit: m, range: [3.0, 3.7], source: spec 5.3 / FHWA typical lane width, verified: true}
  # Defaults by OSM highway class, used when OSM tags are missing.
  # capacity_vphpl = vehicles per hour per lane at v/c = 1 (HCM-style planning capacities).
  defaults_by_class:
    motorway:      {lanes: {value: 4, unit: lanes, range: [3, 6], source: I 15 typical per direction, verified: false}, maxspeed_kph: {value: 105, unit: kph, range: [88, 113], source: CA freeway 65 mph, verified: false}, capacity_vphpl: {value: 2000, unit: vphpl, range: [1800, 2200], source: HCM freeway basic segment, verified: false}}
    motorway_link: {lanes: {value: 1, unit: lanes, range: [1, 2], source: typical ramp, verified: false}, maxspeed_kph: {value: 60, unit: kph, range: [40, 72], source: typical ramp advisory, verified: false}, capacity_vphpl: {value: 1500, unit: vphpl, range: [1200, 1800], source: HCM ramp, verified: false}}
    trunk:         {lanes: {value: 2, unit: lanes, range: [2, 3], source: SR 56 typical per direction, verified: false}, maxspeed_kph: {value: 105, unit: kph, range: [88, 113], source: CA freeway 65 mph, verified: false}, capacity_vphpl: {value: 1900, unit: vphpl, range: [1700, 2100], source: HCM multilane, verified: false}}
    trunk_link:    {lanes: {value: 1, unit: lanes, range: [1, 2], source: typical ramp, verified: false}, maxspeed_kph: {value: 60, unit: kph, range: [40, 72], source: typical ramp, verified: false}, capacity_vphpl: {value: 1400, unit: vphpl, range: [1200, 1800], source: HCM ramp, verified: false}}
    primary:       {lanes: {value: 3, unit: lanes, range: [2, 3], source: suburban 6-lane arterial (Camino Del Sur), verified: false}, maxspeed_kph: {value: 72, unit: kph, range: [56, 80], source: 45 mph posted typical, verified: false}, capacity_vphpl: {value: 900, unit: vphpl, range: [750, 1100], source: HCM signalized arterial planning capacity, verified: false}}
    primary_link:  {lanes: {value: 1, unit: lanes, range: [1, 2], source: guess, verified: false}, maxspeed_kph: {value: 48, unit: kph, range: [32, 56], source: guess, verified: false}, capacity_vphpl: {value: 800, unit: vphpl, range: [600, 1000], source: guess, verified: false}}
    secondary:     {lanes: {value: 2, unit: lanes, range: [1, 3], source: suburban 4-lane arterial, verified: false}, maxspeed_kph: {value: 64, unit: kph, range: [48, 72], source: 40 mph posted typical, verified: false}, capacity_vphpl: {value: 850, unit: vphpl, range: [700, 1000], source: HCM signalized arterial planning capacity, verified: false}}
    secondary_link: {lanes: {value: 1, unit: lanes, range: [1, 2], source: guess, verified: false}, maxspeed_kph: {value: 48, unit: kph, range: [32, 56], source: guess, verified: false}, capacity_vphpl: {value: 750, unit: vphpl, range: [600, 900], source: guess, verified: false}}
    tertiary:      {lanes: {value: 1, unit: lanes, range: [1, 2], source: collector, verified: false}, maxspeed_kph: {value: 56, unit: kph, range: [40, 64], source: 35 mph posted typical, verified: false}, capacity_vphpl: {value: 750, unit: vphpl, range: [600, 900], source: HCM collector, verified: false}}
    tertiary_link: {lanes: {value: 1, unit: lanes, range: [1, 1], source: guess, verified: false}, maxspeed_kph: {value: 40, unit: kph, range: [32, 48], source: guess, verified: false}, capacity_vphpl: {value: 700, unit: vphpl, range: [500, 800], source: guess, verified: false}}
    residential:   {lanes: {value: 1, unit: lanes, range: [1, 1], source: local street, verified: false}, maxspeed_kph: {value: 40, unit: kph, range: [32, 48], source: 25 mph prima facie, verified: false}, capacity_vphpl: {value: 600, unit: vphpl, range: [400, 800], source: local street planning capacity, verified: false}}
    living_street: {lanes: {value: 1, unit: lanes, range: [1, 1], source: local street, verified: false}, maxspeed_kph: {value: 24, unit: kph, range: [16, 32], source: guess, verified: false}, capacity_vphpl: {value: 400, unit: vphpl, range: [300, 600], source: guess, verified: false}}
    unclassified:  {lanes: {value: 1, unit: lanes, range: [1, 1], source: local street, verified: false}, maxspeed_kph: {value: 40, unit: kph, range: [32, 56], source: guess, verified: false}, capacity_vphpl: {value: 600, unit: vphpl, range: [400, 800], source: guess, verified: false}}
    service:       {lanes: {value: 1, unit: lanes, range: [1, 1], source: driveway/parking aisle, verified: false}, maxspeed_kph: {value: 24, unit: kph, range: [16, 32], source: guess, verified: false}, capacity_vphpl: {value: 400, unit: vphpl, range: [300, 600], source: guess, verified: false}}

  msa_max_iterations: {value: 8, unit: count, range: null, source: spec 6.4, verified: true}
  msa_convergence: {value: 0.01, unit: ratio, range: null, source: "spec 6.4: stop when total travel time changes < 1 percent", verified: true}
  signal_fixed_delay_s: {value: 12.0, unit: s, range: [8.0, 20.0], source: "HCM average control delay at an uncongested suburban signal (LOS B)", verified: false}
  signal_vc_delay_s: {value: 30.0, unit: s, range: [20.0, 45.0], source: "extra delay at v/c = 1, scaled by (v/c)^2; simple documented approximation", verified: false}
  unsignalized_delay_s: {value: 2.0, unit: s, range: [0.0, 6.0], source: stop/yield control average, verified: false}
  max_vc_for_bpr: {value: 3.0, unit: ratio, range: null, source: "numerical cap on v/c inside BPR to avoid runaway times", verified: true}
  demand_capacity_factor: {value: 1.0, unit: ratio, range: [0.8, 1.2], source: calibration knob (capacity scale), verified: false}


# Every number that models the real world lives here (spec rule 14.3).
#
# Leaf schema (every leaf that is a modeling number):
#   value:    the number used by default
#   unit:     unit string
#   range:    [low, high] plausible range (used for sensitivity / Monte Carlo where noted)
#   source:   where the number comes from, in plain words
#   verified: true only after a person confirmed it for this region
#
# Code loads this with sim/assumptions.py (or pipeline/assumptions.py) and must
# read `.value`. Do not hardcode any of these numbers elsewhere.

time:
  sim_start: {value: "06:00", unit: clock, range: null, source: spec 6.1, verified: true}
  sim_end: {value: "10:00", unit: clock, range: null, source: spec 6.1, verified: true}
  bin_minutes: {value: 5, unit: min, range: null, source: spec 6.1, verified: true}
  report_start: {value: "06:30", unit: clock, range: null, source: spec 6.1, verified: true}
  report_end: {value: "09:30", unit: clock, range: null, source: spec 6.1, verified: true}

buildings:

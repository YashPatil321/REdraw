# Postgres + PostGIS for Redraw.
# Usage: docker compose -f docker_compose.yml up -d
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: redraw_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-redraw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-redraw}
      POSTGRES_DB: ${POSTGRES_DB:-redraw}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - redraw_pgdata:/var/lib/postgresql/data
      - ./api/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-redraw}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  redraw_pgdata:
